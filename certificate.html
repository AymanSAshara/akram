    }

    /* موضع اسم الطالب داخل السطر المخصص له في التصميم */
    .student-name {
        position: absolute;
        z-index: 2;
        left: 15.0%;
        top: 58.25%;
        width: 65.35%;
        height: 4.65%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.5%;
        overflow: hidden;
        white-space: nowrap;
        direction: rtl;
        color: #075d63;
        background: rgba(250,250,249,.96);
        font-size: 48px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }

    /* موضع الدرجة بين علامة النسبة ووسم النسبة */
    .student-percent {
        position: absolute;
        z-index: 2;
        left: 76.35%;
        top: 80.05%;
        width: 9.55%;
        height: 5.2%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        direction: ltr;
        color: #075d63;
        background: rgba(250,250,249,.97);
        font-size: 42px;
        font-weight: 900;
        line-height: 1;
        text-align: center;
    }

    @supports (font-size: 1cqw) {
        .student-name { font-size: 3.10cqw; }
        .student-percent { font-size: 2.72cqw; }
    }

    .toolbar {
        width: min(96vw, 1536px);
        margin: 16px auto 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .toolbar button {
        border: 0;
        border-radius: 9px;
        padding: 12px 24px;
        background: var(--teal);
        color: #fff;
        font: 700 17px "Cairo", "Tahoma", sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(7,93,99,.22);
    }

    .toolbar button:hover {
        filter: brightness(.94);
    }

    .toolbar button.secondary {
        background: #647273;
    }

    .toolbar button:disabled {
        opacity: .65;
        cursor: wait;
    }

    .share-note {
        width: min(96vw, 1536px);
        margin: 10px auto 0;
        text-align: center;
        color: #465556;
        font-size: 15px;
    }

    .share-status {
        min-height: 24px;
        margin-top: 7px;
        font-weight: 700;
        color: var(--teal);
    }

    @media (max-width: 600px) {
        body { padding: 6px; }
        .certificate-wrap, .toolbar { width: 100%; }
        .student-name { font-weight: 700; }
    }

    @media print {
        @page {
            size: 15in 10in;
            margin: 0;
        }

        html, body {
            width: 15in;
            height: 10in;
            padding: 0;
            margin: 0;
            background: #fff;
            overflow: hidden;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .notice, .toolbar {
            display: none !important;
        }

        .certificate-wrap {
            width: 15in;
            height: 10in;
            margin: 0;
        }

        .certificate {
            width: 15in;
            height: 10in;
            box-shadow: none;
        }
    }
</style>
</head>
<body>

<div id="dataNotice" class="notice">
    لم تصل بيانات الطالب. افتح الشهادة من زر «عرض الشهادة وطباعتها» الموجود بعد اعتماد نتيجة الاختبار.
</div>

<div class="certificate-wrap">
    <main id="certificate" class="certificate" aria-label="شهادة إتمام دورة مقدمات العلوم">
        <div id="certificateName" class="student-name" aria-label="اسم الطالب"></div>
        <div id="certificatePercent" class="student-percent" aria-label="النسبة المئوية"></div>
    </main>
</div>

<div class="toolbar">
    <button id="shareImageBtn" type="button" onclick="shareCertificateImage()">
        إرسال الشهادة إلى واتساب 218914753560
    </button>
    <button class="secondary" type="button" onclick="downloadCertificateImage()">
        تنزيل الشهادة كصورة
    </button>
    <button class="secondary" type="button" onclick="window.print()">
        طباعة الشهادة / حفظها PDF
    </button>
</div>
<div class="share-note">
    سيتم تنزيل صورة الشهادة ثم فتح محادثة واتساب للرقم 218914753560 لإرفاقها.
    <div id="shareStatus" class="share-status" aria-live="polite"></div>
</div>

<script>
window.certificateData = { name: "", percent: "" };

(function loadCertificateData() {
    const params = new URLSearchParams(window.location.search);
    let name = (params.get("name") || "").trim();
    let percent = (params.get("percent") || "").trim();

    if (!name || !percent) {
        try {
            const saved = JSON.parse(localStorage.getItem("quizResult") || "null");
            if (saved) {
                name = name || String(saved.name || "").trim();
                percent = percent || String(saved.percent ?? "").trim();
            }
        } catch (error) {
            console.warn("تعذر قراءة بيانات الاختبار المحفوظة.", error);
        }
    }

    const nameEl = document.getElementById("certificateName");
    const percentEl = document.getElementById("certificatePercent");

    if (name && percent !== "") {
        nameEl.textContent = name;
        percentEl.textContent = percent;
        window.certificateData = { name, percent };
        document.title = `شهادة إتمام الدورة - ${name}`;
        fitNameToBox(nameEl);
    } else {
        nameEl.textContent = "اسم الطالب/ة";
        percentEl.textContent = "--";
        document.getElementById("dataNotice").style.display = "block";
    }

    function fitNameToBox(element) {
        const minimumSize = 20;
        let size = parseFloat(getComputedStyle(element).fontSize);
        let guard = 0;
        while (element.scrollWidth > element.clientWidth && size > minimumSize && guard < 60) {
            size -= 1;
            element.style.fontSize = size + "px";
            guard++;
        }
    }

    window.addEventListener("resize", () => {
        if (name) {
            nameEl.style.fontSize = "";
            requestAnimationFrame(() => fitNameToBox(nameEl));
        }
    });
})();

function loadCanvasImage(src) {
    return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("تعذر تحميل خلفية الشهادة."));
        image.src = src;
    });
}

function getCertificateBackgroundSource() {
    const certificate = document.getElementById("certificate");
    const background = getComputedStyle(certificate).backgroundImage;
    const match = background.match(/^url\(["']?(.*?)["']?\)$/);
    if (!match || !match[1]) {
        throw new Error("تعذر قراءة خلفية الشهادة.");
    }
    return match[1];
}

function fitCanvasText(ctx, text, maximumWidth, initialSize, minimumSize, weight) {
    let size = initialSize;
    while (size > minimumSize) {
        ctx.font = `${weight} ${size}px Tahoma, Arial, sans-serif`;
        if (ctx.measureText(text).width <= maximumWidth) break;
        size -= 1;
    }
    return size;
}

async function createCertificateImageBlob() {
    const { name, percent } = window.certificateData;
    if (!name || percent === "") {
        throw new Error("لا توجد بيانات طالب صالحة لإنشاء الشهادة.");
    }

    if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
    }

    const width = 1536;
    const height = 1024;
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d", { alpha: false });
    const backgroundImage = await loadCanvasImage(getCertificateBackgroundSource());
    ctx.drawImage(backgroundImage, 0, 0, width, height);

    // نفس مواضع البيانات الظاهرة فوق تصميم الشهادة.
    const nameBox = {
        x: width * 0.1500,
        y: height * 0.5825,
        w: width * 0.6535,
        h: height * 0.0465
    };
    ctx.fillStyle = "rgba(250,250,249,0.96)";
    ctx.fillRect(nameBox.x, nameBox.y, nameBox.w, nameBox.h);
    ctx.fillStyle = "#075d63";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.direction = "rtl";
    const nameFontSize = fitCanvasText(ctx, name, nameBox.w * 0.94, 48, 20, 700);
    ctx.font = `700 ${nameFontSize}px Tahoma, Arial, sans-serif`;
    ctx.fillText(name, nameBox.x + nameBox.w / 2, nameBox.y + nameBox.h / 2 + 1);

    const percentBox = {
        x: width * 0.7635,
        y: height * 0.8005,
        w: width * 0.0955,
        h: height * 0.0520
    };
    ctx.fillStyle = "rgba(250,250,249,0.97)";
    ctx.fillRect(percentBox.x, percentBox.y, percentBox.w, percentBox.h);
    ctx.fillStyle = "#075d63";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.direction = "ltr";
    ctx.font = "900 42px Tahoma, Arial, sans-serif";
    ctx.fillText(String(percent), percentBox.x + percentBox.w / 2, percentBox.y + percentBox.h / 2 + 1);

    return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error("تعذر إنشاء صورة الشهادة."));
        }, "image/jpeg", 0.96);
    });
}

function certificateFileName() {
    const rawName = window.certificateData.name || "الطالب";
    const safeName = rawName.replace(/[\/:*?"<>|]+/g, "-").trim().slice(0, 70) || "الطالب";
    return `شهادة-${safeName}.jpg`;
}

function downloadBlob(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function downloadCertificateImage() {
    const status = document.getElementById("shareStatus");
    try {
        status.textContent = "جاري تجهيز صورة الشهادة...";
        const blob = await createCertificateImageBlob();
        downloadBlob(blob, certificateFileName());
        status.textContent = "تم تنزيل صورة الشهادة.";
    } catch (error) {
        console.error(error);
        status.textContent = "تعذر إنشاء الصورة.";
        alert(error.message || "تعذر إنشاء صورة الشهادة.");
    }
}

const WHATSAPP_PHONE = "218914753560";

function buildWhatsAppCertificateUrl() {
    const { name, percent } = window.certificateData;
    const message = [
        "شهادة إتمام دورة مقدمات العلوم",
        `اسم الطالب: ${name}`,
        `النسبة: ${percent}%`,
        "",
        "صورة الشهادة جاهزة للإرفاق في هذه المحادثة."
    ].join("\n");

    return `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;
}

function openTargetWhatsApp(url, preparedWindow) {
    if (preparedWindow && !preparedWindow.closed) {
        preparedWindow.location.href = url;
        return;
    }

    const opened = window.open(url, "_blank");
    if (!opened) {
        window.location.href = url;
    }
}

async function shareCertificateImage() {
    const button = document.getElementById("shareImageBtn");
    const status = document.getElementById("shareStatus");
    const originalText = button.textContent;

    if (!window.certificateData.name || window.certificateData.percent === "") {
        alert("لا توجد بيانات طالب صالحة لإنشاء الشهادة.");
        return;
    }

    // فتح نافذة مؤقتة فور النقر لتجنب منع المتصفح فتح واتساب بعد تجهيز الصورة.
    const whatsappWindow = window.open("about:blank", "_blank");
    if (whatsappWindow) {
        whatsappWindow.document.title = "جاري فتح واتساب";
        whatsappWindow.document.body.dir = "rtl";
        whatsappWindow.document.body.style.fontFamily = "Tahoma, Arial, sans-serif";
        whatsappWindow.document.body.style.textAlign = "center";
        whatsappWindow.document.body.style.padding = "40px";
        whatsappWindow.document.body.textContent = "جاري تجهيز صورة الشهادة وفتح واتساب...";
    }

    button.disabled = true;
    button.textContent = "جاري تجهيز الصورة...";
    status.textContent = "جاري إنشاء صورة الشهادة عالية الجودة...";

    try {
        const blob = await createCertificateImageBlob();
        downloadBlob(blob, certificateFileName());

        openTargetWhatsApp(buildWhatsAppCertificateUrl(), whatsappWindow);
        status.textContent = `تم تنزيل صورة الشهادة وفتح محادثة الرقم ${WHATSAPP_PHONE}. أرفق الصورة التي تم تنزيلها ثم اضغط إرسال.`;
    } catch (error) {
        if (whatsappWindow && !whatsappWindow.closed) {
            whatsappWindow.close();
        }
        console.error(error);
        status.textContent = "تعذر إنشاء صورة الشهادة أو فتح واتساب.";
        alert(error.message || "تعذر إنشاء صورة الشهادة أو فتح واتساب.");
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}
</script>

</body>
</html>
